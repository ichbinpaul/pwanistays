name: Refresh WhatsApp catalogue source

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Export only, test one property, or sync the catalogue'
        type: choice
        options: [source_only, test_one_property, sync]
        default: source_only
      connect_catalogue:
        description: 'Link the target only if no different catalogue is linked'
        type: boolean
        default: false
  schedule:
    # Refresh preview pages hourly. Keep optional Meta sync at 07:15 EAT only.
    - cron: '15 0-3,5-23 * * *'
    - cron: '15 4 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: public-whatsapp-catalogue-source
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public catalogue extraction
        run: python3 -m unittest discover -s tests -v
      - name: Test property links and pending-page fallback
        run: node --test tests/property_links.test.js tests/property_redirects.test.mjs
      - name: Refresh source from active public properties and galleries
        run: python3 scripts/build_whatsapp_catalogue.py --routing-settings catalogue/property-url-settings.json
      - name: Generate per-property preview pages and matching sitemap
        run: |
          python3 scripts/cache_property_covers.py
          python3 scripts/build_property_previews.py
          python3 scripts/build_stay_directory.py
          python3 scripts/build_property_sitemap.py --source catalogue/properties.json --covers catalogue/cover-images.json
      - name: Validate hotel payloads without contacting Meta
        run: python3 scripts/sync_meta_hotels.py
      - name: Commit source files only when changed
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add -- catalogue/properties.json catalogue/status.json catalogue/cover-images.json catalogue/property-slugs.json property-routes.js images/property-covers stays stays.html property-sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Catalogue source is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public property previews and catalogue source" -- catalogue/properties.json catalogue/status.json catalogue/cover-images.json catalogue/property-slugs.json property-routes.js images/property-covers stays stays.html property-sitemap.xml robots.txt
          # Normal push: a concurrent main-branch update must fail rather than be overwritten.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request branch-based GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build_type="$(gh api "repos/$GH_REPO/pages" --jq '.build_type')"
          case "$build_type" in
            legacy)
              # Also recover a previous publication failure when data is unchanged.
              latest_commit="$(gh api "repos/$GH_REPO/pages/builds/latest" --jq 'if .status == "built" then .commit else "" end')"
              if [ "$latest_commit" = "$(git rev-parse HEAD)" ]; then
                echo "The current commit already has a successful Pages build."
                exit 0
              fi
              gh api --method POST "repos/$GH_REPO/pages/builds"
              echo "Requested a GitHub Pages build. Check its result before treating the hosted feed as refreshed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            workflow)
              echo "::error::This site uses workflow-based Pages deployment. Catalogue source was committed, but publication needs the site's explicit Pages deployment workflow. No hosted refresh is claimed."
              exit 1
              ;;
            *)
              echo "::error::Unsupported or unknown Pages build type. Catalogue source was committed; hosted publication has not been established."
              exit 1
              ;;
          esac
      - name: Sync the approved destination catalogue
        # A Pages error must not suppress an independently configured API sync.
        # Source/test/commit failures still prevent all catalogue writes.
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && ((github.event_name == 'schedule' && github.event.schedule == '15 4 * * *' && vars.META_CATALOGUE_SYNC_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'test_one_property' || inputs.operation == 'sync'))) }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_CATALOGUE_ID: ${{ vars.META_CATALOGUE_ID || '1686254389800444' }}
          META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ vars.META_WHATSAPP_BUSINESS_ACCOUNT_ID || '470793059453050' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_HOTEL_DETAILS_JSON: ${{ secrets.META_HOTEL_DETAILS_JSON }}
          META_CATALOGUE_CONNECT_ENABLED: ${{ vars.META_CATALOGUE_CONNECT_ENABLED }}
          META_CATALOGUE_PRUNE_ENABLED: ${{ vars.META_CATALOGUE_PRUNE_ENABLED }}
          META_SYNC_OPERATION: ${{ inputs.operation }}
          META_CONNECT_REQUESTED: ${{ inputs.connect_catalogue }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          args = ["python3", "scripts/sync_meta_hotels.py", "--apply"]
          single = os.environ.get("META_SYNC_OPERATION") == "test_one_property"
          if single:
              source = json.loads(Path("catalogue/properties.json").read_text(encoding="utf-8"))
              args.extend(["--only", source["properties"][0]["id"]])
          if os.environ.get("META_CATALOGUE_CONNECT_ENABLED") == "true" or os.environ.get("META_CONNECT_REQUESTED") == "true":
              args.append("--connect")
          if not single and os.environ.get("META_CATALOGUE_PRUNE_ENABLED") == "true":
              args.append("--prune")
          with tempfile.TemporaryDirectory() as directory:
              details = os.environ.get("META_HOTEL_DETAILS_JSON")
              if details:
                  path = Path(directory) / "hotel-details.json"
                  path.write_text(details, encoding="utf-8")
                  path.chmod(0o600)
                  args.extend(["--details", str(path)])
              result = subprocess.run(args, check=False)
              raise SystemExit(result.returncode)
          PY
      - name: Explain export boundary
        run: |
          echo "### Public catalogue source refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "Source export is separate from Meta activation. API sync requires an explicit manual test/sync selection, or scheduled activation with META_CATALOGUE_SYNC_ENABLED=true, plus secure access. No messages are sent." >> "$GITHUB_STEP_SUMMARY"
          echo "For branch-based Pages, this workflow checks publication and requests a build if needed. Build completion and served content must still be checked." >> "$GITHUB_STEP_SUMMARY"
