name: Refresh active property sitemap

on:
  workflow_dispatch:
  schedule:
    # Daily 07:00 East Africa Time / 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: public-property-sitemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sitemap formatting and public configuration
        run: python3 -m unittest discover -s tests -p 'test_property_sitemap.py' -v
      - name: Generate property sitemap from active public records
        run: python3 scripts/build_property_sitemap.py
      - name: Commit sitemap only if URLs changed
        run: |
          git add property-sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sitemap is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SEO: refresh active property URLs in sitemap"
          git push
